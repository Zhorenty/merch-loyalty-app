name: merch
description: Служебное приложение кассы лояльности MERCH.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  meta: any
  rxdart: ^0.28.0
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  flutter_secure_storage: ^9.2.4
  path: ^1.9.0
  intl: ^0.20.2
  intl_utils: ^2.8.13
  clock: ^1.1.2
  stack_trace: ^1.12.1
  go_router: ^14.8.1
  cupertino_icons: ^1.0.8
  mobile_scanner: ^6.0.10
  uuid: ^4.5.1
  package_info_plus: ^8.3.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/shimmer.frag
  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/src/core/constant/generated
  line_length: 80

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: ru
  arb_dir: lib/src/core/constant/localization/l10n
  output_dir: lib/src/core/constant/localization/generated
